      // === 新增：球拍軌跡優化函式 ===
      function smoothPaddleData(data) {
        console.log("正在優化球拍軌跡...");
        const paddleJoints = ["top", "bottom", "left", "right", "center"];
        const maxSpeedThreshold = 0.5; // 閾值：如果一幀移動超過 0.5 單位(約25公分)，視為異常
        const smoothWindow = 3; // 平滑窗口大小

        paddleJoints.forEach((joint) => {
          // 1. 提取該關節的所有幀數據
          let points = data.map((frame) => {
            if (
              frame.paddle &&
              frame.paddle[joint] &&
              validPoint(frame.paddle[joint])
            ) {
              return { ...frame.paddle[joint], valid: true };
            }
            return { x: null, y: null, z: null, valid: false };
          });

          // 2. 去除離群值 (Outlier Removal)
          // 如果某點跟上一個有效點距離太遠，視為誤判，將其標記為無效
          let lastValidIdx = -1;
          for (let i = 0; i < points.length; i++) {
            if (!points[i].valid) continue;

            if (lastValidIdx !== -1) {
              const p1 = points[lastValidIdx];
              const p2 = points[i];
              const dist = Math.sqrt(
                Math.pow(p2.x - p1.x, 2) +
                  Math.pow(p2.y - p1.y, 2) +
                  Math.pow(p2.z - p1.z, 2),
              );

              // 如果距離過大 (可能是飛掉的點)，將其視為無效
              // 注意：這裡要考慮幀數間隔，如果中間隔了很多幀，距離大是正常的
              const frameGap = i - lastValidIdx;
              if (dist > maxSpeedThreshold * frameGap) {
                points[i].valid = false;
                continue; // 跳過此點，不更新 lastValidIdx
              }
            }
            lastValidIdx = i;
          }

          // 3. 填補缺失值 (Linear Interpolation)
          for (let i = 0; i < points.length; i++) {
            if (!points[i].valid) {
              // 尋找前一個有效點
              let prevIdx = -1;
              for (let j = i - 1; j >= 0; j--) {
                if (points[j].valid) {
                  prevIdx = j;
                  break;
                }
              }

              // 尋找後一個有效點
              let nextIdx = -1;
              for (let j = i + 1; j < points.length; j++) {
                if (points[j].valid) {
                  nextIdx = j;
                  break;
                }
              }

              // 如果前後都有點，進行插值
              if (prevIdx !== -1 && nextIdx !== -1) {
                const ratio = (i - prevIdx) / (nextIdx - prevIdx);
                points[i].x =
                  points[prevIdx].x +
                  (points[nextIdx].x - points[prevIdx].x) * ratio;
                points[i].y =
                  points[prevIdx].y +
                  (points[nextIdx].y - points[prevIdx].y) * ratio;
                points[i].z =
                  points[prevIdx].z +
                  (points[nextIdx].z - points[prevIdx].z) * ratio;
                points[i].valid = true; // 標記為修復完成
              }
            }
          }

          // 4. 簡單平滑化 (Moving Average)
          // 避免插值後的轉折太生硬
          const smoothedPoints = JSON.parse(JSON.stringify(points));
          for (let i = 0; i < points.length; i++) {
            if (!points[i].valid) continue;

            let sumX = 0,
              sumY = 0,
              sumZ = 0,
              count = 0;
            for (let j = -smoothWindow; j <= smoothWindow; j++) {
              const idx = i + j;
              if (idx >= 0 && idx < points.length && points[idx].valid) {
                sumX += points[idx].x;
                sumY += points[idx].y;
                sumZ += points[idx].z;
                count++;
              }
            }
            smoothedPoints[i].x = sumX / count;
            smoothedPoints[i].y = sumY / count;
            smoothedPoints[i].z = sumZ / count;
          }

          // 5. 將處理好的數據寫回原始 data
          for (let i = 0; i < data.length; i++) {
            if (smoothedPoints[i].valid) {
              if (!data[i].paddle) data[i].paddle = {};
              data[i].paddle[joint] = {
                x: smoothedPoints[i].x,
                y: smoothedPoints[i].y,
                z: smoothedPoints[i].z,
              };
            }
          }
        });
        console.log("球拍軌跡優化完成");
      }

      // 載入 JSON 檔案
      function loadJSONFile(file) {
        return file
          .text()
          .then((txt) => {
            resetAllStates();
            trajectoryData = JSON.parse(
              txt
                .replace(/^\uFEFF/, "")
                .replace(/:\s*NaN/g, ": null")
                .trim(),
            );
            if (!Array.isArray(trajectoryData))
              trajectoryData = [trajectoryData];

            // === 新增這行：在處理其他邏輯前，先修復球拍軌跡 ===
            smoothPaddleData(trajectoryData);
            // ==============================================

            window.hitFrames = [];
            trajectoryData.forEach((frame, index) => {
              if (frame.tennis_ball_hit === true) {
                window.hitFrames.push(index);
              }
            });
            console.log("找到的擊球 frames:", window.hitFrames);

            computeGlobalCenterAndMinY();
            document.getElementById("slider").max = trajectoryData.length - 1;
            updateFrame();

            showingFullTrajectory = true;
            const btn = document.getElementById("showFullTrajectoryButton");
            btn.textContent = "hide trajectory";
            btn.style.background = "#f44336";
            calculateFullTrajectory();

            // 載入並更新 feedback，但不動 overallContent
            return loadFeedbackFile(file.name).then(() => {
              const feedbackContent =
                document.getElementById("feedbackContent");
              const overallContent = document.getElementById("overallContent");
              feedbackContent.textContent = originalFeedbackContent;
              if (isTranslated) {
                overallContent.textContent = originalOverallContent;
              }
              isTranslated = false;
              document.getElementById("toggleLanguage").checked = false;
              document.getElementById("toggleLanguage").textContent = "Eng";
            });
          })
          .catch((e) => {
            console.error(e);
            alert("Error: " + e.message);
          });
      }

      // 載入 Feedback 檔案
      function loadFeedbackFile(mainFileName) {
        const feedbackFileName = mainFileName.replace(
          "(3D_trajectory_smoothed)",
          "_gpt_feedback",
        );
        const fi = document.getElementById("dirInput");
        if (!fi) return Promise.resolve();

        const fFile = Array.from(fi.files).find(
          (f) => f.name === feedbackFileName,
        );
        const feedbackContent = document.getElementById("feedbackContent");
        // 不動 overallContent，除非明確重置
        const overallContent = document.getElementById("overallContent");

        if (!fFile) {
          feedbackContent.textContent = "No feedback file found";
          originalFeedbackContent = "No feedback file found";
          // 不更新 originalOverallContent，除非是首次載入或重置
          if (!originalOverallContent) {
            originalOverallContent = "No overall suggestion available";
          }
          isTranslated = false;
          document.getElementById("toggleLanguage").textContent = "ENG";
          window.problemFrameRange = null;
          return Promise.resolve();
        }

        return fFile.text().then((txt) => {
          console.log("讀取的 feedback 文件為：" + fFile.name);
          try {
            const data = JSON.parse(txt.replace(/:\s*NaN/g, ": null"));
            // 只更新 feedbackContent 和 originalFeedbackContent
            originalFeedbackContent =
              data.suggestion || "No feedback available";
            feedbackContent.textContent = originalFeedbackContent;
            // 僅在首次載入或 overallContent 為空時更新 originalOverallContent
            if (!originalOverallContent) {
              originalOverallContent =
                data.overall_suggestion || "No overall suggestion available";
              overallContent.textContent = originalOverallContent;
            }
            // 如果之前已翻譯，恢復為原始中文
            if (isTranslated) {
              overallContent.textContent = originalOverallContent;
              feedbackContent.textContent = originalFeedbackContent;
            }
            isTranslated = false;
            document.getElementById("toggleLanguage").checked = false;
            document.getElementById("toggleLanguage").textContent = "Eng";

            // 確保 problem_frame 被正確解析
            if (data.problem_frame && typeof data.problem_frame === "string") {
              const frameRangeStr = data.problem_frame;
              const match = frameRangeStr.match(/(\d+)(?:[-~]|到|to)(\d+)/);
              if (match) {
                window.problemFrameRange = [
                  parseInt(match[1]),
                  parseInt(match[2]),
                ];
              } else {
                const singleFrame = parseInt(frameRangeStr);
                if (!isNaN(singleFrame)) {
                  window.problemFrameRange = [singleFrame, singleFrame];
                }
              }
              console.log(
                "设置的 problemFrameRange:",
                window.problemFrameRange,
              );
              if (showingFullTrajectory) {
                calculateFullTrajectory();
              }
            } else {
              window.problemFrameRange = null;
            }
          } catch (e) {
            console.error("解析 feedback 文件时出错:", e);
            feedbackContent.textContent = "No feedback available";
            originalFeedbackContent = "No feedback available";
            if (!originalOverallContent) {
              originalOverallContent = "No overall suggestion available";
              overallContent.textContent = originalOverallContent;
            }
            if (isTranslated) {
              overallContent.textContent = originalOverallContent;
              feedbackContent.textContent = originalFeedbackContent;
            }
            isTranslated = false;
            document.getElementById("toggleLanguage").checked = false;
            document.getElementById("toggleLanguage").textContent = "Eng";
            window.problemFrameRange = null;
          }
        });
      }

      // 計算全域中心與最小 Y 值
      function computeGlobalCenterAndMinY() {
        let footPositions = [];
        trajectoryData.forEach((f) => {
          if (validPoint(f.left_ankle)) footPositions.push(f.left_ankle);
          if (validPoint(f.right_ankle)) footPositions.push(f.right_ankle);
        });
        if (!footPositions.length) {
          globalCenter = { x: 0, z: 0 };
          globalMinY = 0;
          return;
        }
        let sx = 0,
          sz = 0;
        footPositions.forEach((p) => {
          sx += p.x;
          sz += p.z;
        });
        globalCenter.x = sx / footPositions.length;
        globalCenter.z = sz / footPositions.length;
        globalMinY = Math.min(...footPositions.map((p) => p.y));
      }

      // 簡單驗證點資料是否有效
      function validPoint(p) {
        return (
          p &&
          p.x != null &&
          p.y != null &&
          p.z != null &&
          !isNaN(p.x + p.y + p.z)
        );
      }

      // 清除軌跡
      function clearTrajectories() {
        Object.values(trajectorySystem).forEach((sys) => {
          sys.points.forEach((pt) => {
            pt.traverse((c) => c.element && c.element.remove());
            scene.remove(pt);
          });
          sys.points = [];
          sys.line.geometry.setFromPoints([]);
          sys.line.visible = false;
          if (sys.lines) {
            sys.lines.forEach((l) => scene.remove(l));
            sys.lines = [];
          }
        });
      }

      // 創建軌跡標記 (含小點與文字標籤)
      function createMarkerPoint(pos, text, color, alpha = 0.55, options = {}) {
        const group = new THREE.Group();
        const pointDiv = document.createElement("div");
        pointDiv.className = "trajectory-point";
        pointDiv.style.background = color;
        pointDiv.style.width = "4.8px";
        pointDiv.style.height = "4.8px";
        pointDiv.style.borderRadius = "50%";
        pointDiv.style.border = options.coreBorder || "0.6px solid rgba(255,255,255,0.55)";
        pointDiv.style.opacity = String(THREE.MathUtils.clamp(alpha, 0.08, 1.0));
        const point = new CSS2DObject(pointDiv);
        point.position.copy(pos);
        const labelDiv = document.createElement("div");
        labelDiv.className = "marker-label";
        labelDiv.textContent = text;
        const label = new CSS2DObject(labelDiv);
        label.position.copy(pos);
        group.add(point, label);
        group.userData.pointDiv = pointDiv;
        return group;
      }

      function smoothTrajectoryPoints(points, segmentSubdivisions = 5) {
        if (!points || points.length < 4) return points || [];
        const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal', 0.5);
        const count = Math.max(points.length * segmentSubdivisions, points.length);
        return curve.getPoints(count);
      }

      function updateTrajectoryTemporalFade() {
        if (!showingFullTrajectory) return;

        const fadeWindow = 18;
        const falloffPow = 2.8;
        const minAlphaPoints = 0.32;  // 提高30%，原為 0.02
        const minAlphaLines = 0.32;   // 提高30%，原為 0.015

        Object.values(trajectorySystem).forEach((sys) => {
          (sys.points || []).forEach((mk) => {
            const frameIdx = mk.userData?.frameIdx;
            const pointDiv = mk.userData?.pointDiv;
            if (typeof frameIdx !== 'number' || !pointDiv) return;
            const distance = Math.abs(frameIdx - currentFrame);
            const t = THREE.MathUtils.clamp(1 - distance / fadeWindow, 0, 1);
            const alpha = THREE.MathUtils.lerp(minAlphaPoints, 0.98, Math.pow(t, falloffPow));
            pointDiv.style.opacity = String(alpha);
          });

          (sys.lines || []).forEach((segLine) => {
            const frameIdx = segLine.userData?.frameIdx;
            if (typeof frameIdx !== 'number' || !segLine.material) return;
            const distance = Math.abs(frameIdx - currentFrame);
            const t = THREE.MathUtils.clamp(1 - distance / fadeWindow, 0, 1);
            segLine.material.opacity = THREE.MathUtils.lerp(minAlphaLines, 0.98, Math.pow(t, falloffPow));
          });
        });
      }

      // 計算並顯示全軌跡
      function calculateFullTrajectory() {
        console.log("目前 problemFrameRange:", window.problemFrameRange);
        console.log("击球 frames:", window.hitFrames);

        clearTrajectories();
        if (!showingFullTrajectory) return;

        ["right_wrist", "tennis_ball", "paddle_center"].forEach((name) => {
          const sys = trajectorySystem[name],
            arr = [];
          const frameIdxArr = [];
          let hitPointCount = 0; // 计算击球点的数量

          trajectoryData.forEach((f, i) => {
            let p;
            if (name === "paddle_center") {
              p = f.paddle && f.paddle.center;
            } else {
              p = f[name];
            }
            if (validPoint(p)) {
              const v = new THREE.Vector3(
                (p.x - globalCenter.x) * SCALE_FACTOR,
                (p.y - globalMinY) * SCALE_FACTOR,
                -(p.z - globalCenter.z) * SCALE_FACTOR,
              );
              arr.push(v);
              frameIdxArr.push(i);

              let c = sys.color;
              // 判断是否是问题范围内的 frame（对 right_wrist 和 paddle_center）
              if (
                (name === "right_wrist" || name === "paddle_center") &&
                window.problemFrameRange
              ) {
                const [st, ed] = window.problemFrameRange;
                if (i >= st && i <= ed) {
                  c = "#FF0000"; // 使用红色标记问题区域
                  console.log(`标记为问题区域: Frame ${i}`); // 调试输出
                }
              }

              // 判断是否是击球的 frame（对 right_wrist 和 paddle_center）
              if (
                (name === "right_wrist" || name === "paddle_center") &&
                window.hitFrames &&
                window.hitFrames.includes(i)
              ) {
                c = "#00FFFF"; // 使用青色标记击球 frame
                hitPointCount++;
              }

              let frameInfo = `Frame: ${i}\nX:${p.x.toFixed(1)}\nY:${p.y.toFixed(1)}\nZ:${p.z.toFixed(1)}`;
              // 如果是击球 frame，添加标记
              if (window.hitFrames && window.hitFrames.includes(i)) {
                frameInfo += "\n[HIT]";
              }
              // 如果是问题区域，添加标记
              if (window.problemFrameRange) {
                const [st, ed] = window.problemFrameRange;
                if (i >= st && i <= ed) {
                  frameInfo += "\n[PROBLEM]";
                }
              }

              const mk = createMarkerPoint(v, frameInfo, c, 0.2);
              if (name === "tennis_ball") {
                mk.userData.pointDiv.style.background = "#d9f99d";
                mk.userData.pointDiv.style.border = "0.6px solid rgba(240,255,220,0.95)";
              }
              mk.userData.frameIdx = i;
              scene.add(mk);
              sys.points.push(mk);
            }
          });

          console.log(
            `${name} 轨迹总点数: ${arr.length}, 击球点数: ${hitPointCount}`,
          );

          if (!arr.length) return;

          const linePoints = arr;

          sys.line.visible = false;
          sys.lines = sys.lines || [];

          if (linePoints.length >= 2) {
            for (let segIdx = 0; segIdx < linePoints.length - 1; segIdx++) {
              const segGeo = new THREE.BufferGeometry().setFromPoints([
                linePoints[segIdx],
                linePoints[segIdx + 1],
              ]);

              const midFrameIdx = Math.round((frameIdxArr[segIdx] + frameIdxArr[segIdx + 1]) * 0.5);

              const segMat = new THREE.LineBasicMaterial({
                color: new THREE.Color(sys.color),
                transparent: true,
                opacity: name === "tennis_ball" ? 0.52 : 0.2,
                depthTest: false,
                depthWrite: false,
              });
              const segLine = new THREE.Line(segGeo, segMat);
              segLine.userData.frameIdx = midFrameIdx;
              segLine.renderOrder = 8;
              segLine.frustumCulled = false;
              scene.add(segLine);
              sys.lines.push(segLine);
            }
          }
        });

        updateTrajectoryTemporalFade();
      }

      // 更新指定影格下的關節與骨架連線位置
      function updatePose(idx) {
        if (!trajectoryData[idx]) return;
        const frame = trajectoryData[idx];
        const prevPoseIdx = window.__lastPoseFrameIdx;
        const isSequentialFrame = prevPoseIdx == null || Math.abs(idx - prevPoseIdx) <= 1;
        if (!window.__jointJumpGuard) {
          window.__jointJumpGuard = {};
        }

        Object.entries(joints3D).forEach(([n, m]) => {
          let p;
          // 處理 paddle 的巢狀結構
          if (n.startsWith("paddle_")) {
            const paddlePoint = n.split("_")[1]; // top, right, bottom, left, center
            p = frame.paddle && frame.paddle[paddlePoint];
          } else {
            p = frame[n];
          }
          if (validPoint(p) && visibilityState[n]) {
            const nextPos = new THREE.Vector3(
              (p.x - globalCenter.x) * SCALE_FACTOR,
              (p.y - globalMinY) * SCALE_FACTOR,
              -(p.z - globalCenter.z) * SCALE_FACTOR,
            );

            const guardState = window.__jointJumpGuard[n] || null;
            const canGuard = isSequentialFrame && isHumanJointName(n) && guardState && guardState.pos;

            if (canGuard) {
              const jumpDist = nextPos.distanceTo(guardState.pos);
              const jumpThreshold = getJointJumpThreshold(n);
              if (jumpDist > jumpThreshold) {
                const holdCount = guardState.holdCount || 0;
                if (holdCount < 2) {
                  m.position.copy(guardState.pos);
                  window.__jointJumpGuard[n] = {
                    pos: guardState.pos.clone(),
                    holdCount: holdCount + 1,
                  };
                } else {
                  m.position.copy(nextPos);
                  window.__jointJumpGuard[n] = {
                    pos: nextPos.clone(),
                    holdCount: 0,
                  };
                }
              } else {
                m.position.copy(nextPos);
                window.__jointJumpGuard[n] = {
                  pos: nextPos.clone(),
                  holdCount: 0,
                };
              }
            } else {
              m.position.copy(nextPos);
              window.__jointJumpGuard[n] = {
                pos: nextPos.clone(),
                holdCount: 0,
              };
            }

            m.visible = true;
            setJointMarkerVisual(m, n === 'tennis_ball' || showRecognitionPoints);
          } else {
            setJointMarkerVisual(m, false);
            m.visible = false;
          }
        });
        window.__lastPoseFrameIdx = idx;
        skeletonConnections.forEach((c, i) => {
          const [s, e] = c;
          let sp, ep;
          // 處理起點
          if (s.startsWith("paddle_")) {
            const paddlePoint = s.split("_")[1];
            sp = frame.paddle && frame.paddle[paddlePoint];
          } else {
            sp = frame[s];
          }
          // 處理終點
          if (e.startsWith("paddle_")) {
            const paddlePoint = e.split("_")[1];
            ep = frame.paddle && frame.paddle[paddlePoint];
          } else {
            ep = frame[e];
          }
          if (
            validPoint(sp) &&
            validPoint(ep) &&
            visibilityState[s] &&
            visibilityState[e]
          ) {
            const positions = [
              (sp.x - globalCenter.x) * SCALE_FACTOR,
              (sp.y - globalMinY) * SCALE_FACTOR,
              -(sp.z - globalCenter.z) * SCALE_FACTOR,
              (ep.x - globalCenter.x) * SCALE_FACTOR,
              (ep.y - globalMinY) * SCALE_FACTOR,
              -(ep.z - globalCenter.z) * SCALE_FACTOR,
            ];
            lines[i].geometry.setPositions(positions);
            if (typeof lines[i].computeLineDistances === "function") {
              lines[i].computeLineDistances();
            }
            // 骨架線已移除，全部隱藏
            lines[i].visible = false;

            const bone = boneMeshes[i];
            if (bone) {
              // 移除 3D 骨架顯示邏輯
              bone.visible = false;
            }
          } else {
            lines[i].visible = false;
            if (boneMeshes[i]) {
              boneMeshes[i].visible = false;
            }
          }
        });

        // === 更新 THREE.js 團柱體人體模型 ===
        updateMannequin();

        // GLB 模型已停用
        // if (glbModelReady && showGLBModel) {
        //   try { updateGLBModel(frame); } catch (err) { console.error(err); }
        // }

        // === 球拍拍面 / 外框（需要四點） ===
        // 使用 try-catch 避免該區段錯誤卡死整個updatePose
        try {
          const topP = frame.paddle && frame.paddle.top;
          const rightP = frame.paddle && frame.paddle.right;
          const bottomP = frame.paddle && frame.paddle.bottom;
          const leftP = frame.paddle && frame.paddle.left;

          const canDrawFace =
            validPoint(topP) &&
            validPoint(rightP) &&
            validPoint(bottomP) &&
            validPoint(leftP) &&
            visibilityState["paddle_center"];

          if (canDrawFace) {
            const t = new THREE.Vector3(
              (topP.x - globalCenter.x) * SCALE_FACTOR,
              (topP.y - globalMinY) * SCALE_FACTOR,
              -(topP.z - globalCenter.z) * SCALE_FACTOR,
            );
            const r = new THREE.Vector3(
              (rightP.x - globalCenter.x) * SCALE_FACTOR,
              (rightP.y - globalMinY) * SCALE_FACTOR,
              -(rightP.z - globalCenter.z) * SCALE_FACTOR,
            );
            const vecB = new THREE.Vector3(
              (bottomP.x - globalCenter.x) * SCALE_FACTOR,
              (bottomP.y - globalMinY) * SCALE_FACTOR,
              -(bottomP.z - globalCenter.z) * SCALE_FACTOR,
            );
            const l = new THREE.Vector3(
              (leftP.x - globalCenter.x) * SCALE_FACTOR,
              (leftP.y - globalMinY) * SCALE_FACTOR,
              -(leftP.z - globalCenter.z) * SCALE_FACTOR,
            );

            // 中心：優先用 paddle_center，否則四點平均
            const pc = frame.paddle && frame.paddle.center;
            let C;
            if (validPoint(pc)) {
              C = new THREE.Vector3(
                (pc.x - globalCenter.x) * SCALE_FACTOR,
                (pc.y - globalMinY) * SCALE_FACTOR,
                -(pc.z - globalCenter.z) * SCALE_FACTOR,
              );
            } else {
              C = new THREE.Vector3()
                .add(t)
                .add(r)
                .add(vecB)
                .add(l)
                .multiplyScalar(0.25);
            }

            // 建立局部座標：x̂ 沿 left→right，ŷ 沿 bottom→top，ẑ 為法向
            let xAxis = new THREE.Vector3().subVectors(r, l);
            let yAxis = new THREE.Vector3().subVectors(t, vecB);

            // 避免 NaN
            if (xAxis.lengthSq() < 1e-9) xAxis.set(1, 0, 0);
            else xAxis.normalize();

            // 若 yAxis 與 xAxis 平行或長度為0，重新計算
            const dot = yAxis.dot(xAxis);
            yAxis.sub(xAxis.clone().multiplyScalar(dot));

            if (yAxis.lengthSq() < 1e-8) {
              // 嘗試用 t-C
              yAxis = new THREE.Vector3().subVectors(t, C).normalize();
              yAxis.sub(xAxis.clone().multiplyScalar(yAxis.dot(xAxis)));
            }

            if (yAxis.lengthSq() < 1e-9) yAxis.set(0, 1, 0);
            else yAxis.normalize();

            const zAxis = new THREE.Vector3()
              .crossVectors(xAxis, yAxis)
              .normalize();
            // 確保正交
            yAxis
              .copy(new THREE.Vector3().crossVectors(zAxis, xAxis))
              .normalize();

            const to2 = (v) =>
              new THREE.Vector2(
                v.clone().sub(C).dot(xAxis),
                v.clone().sub(C).dot(yAxis),
              );
            const from2 = (v2, zOffset = 0) =>
              new THREE.Vector3()
                .copy(C)
                .addScaledVector(xAxis, v2.x)
                .addScaledVector(yAxis, v2.y)
                .addScaledVector(zAxis, zOffset);

            const top2 = to2(t);
            const right2 = to2(r);
            const bottom2 = to2(vecB);
            const left2 = to2(l);

            const halfWidth = Math.max(Math.abs(right2.x), Math.abs(left2.x), 0.06);
            const topReach = Math.max(top2.y, 0.08);
            const bottomReach = Math.max(-bottom2.y, 0.08);

            const buildRacketShape = (widthScale = 1, topScale = 1, bottomScale = 1) => {
              const w = halfWidth * widthScale;
              const topY = topReach * topScale;
              const bottomY = bottomReach * bottomScale;
              const shoulderY = topY * 0.16;
              const lowerMidY = -bottomY * 0.10;

              const shape = new THREE.Shape();
              shape.moveTo(0, topY);
              
              // 右上部分：從頂部到右側中點
              shape.bezierCurveTo(
                w * 0.86, topY * 0.98,
                w * 1.03, shoulderY,
                w, lowerMidY,
              );
              
              // 右下部分：加強圓弧感，讓下半部更接近橢圓
              shape.bezierCurveTo(
                w * 0.98, -bottomY * 0.58,
                w * 0.36, -bottomY * 0.96,
                0, -bottomY,
              );
              
              // 左下部分：從底部到左側中點 - 左右對稱
              shape.bezierCurveTo(
                -w * 0.36, -bottomY * 0.96,
                -w * 0.98, -bottomY * 0.58,
                -w, lowerMidY,
              );
              
              // 左上部分：從左中點回到頂部
              shape.bezierCurveTo(
                -w * 1.03, shoulderY,
                -w * 0.86, topY * 0.98,
                0, topY,
              );
              return shape;
            };

            const SEG = 128;
            const outerShape = buildRacketShape(1.0, 1.0, 1.0);
            const outer2DPoints = outerShape.getPoints(SEG);
            const outlinePts = outer2DPoints.map((point) => from2(point));
            const curve = new THREE.CatmullRomCurve3(
              outlinePts,
              true,
              "centripetal",
              0.25,
            );

            window.paddleFrameBasis = {
              center: C.clone(),
              xAxis: xAxis.clone(),
              yAxis: yAxis.clone(),
              zAxis: zAxis.clone(),
              halfWidth,
              topReach,
              bottomReach,
              throatJoinY: -bottomReach * 0.62,
            };

            // 從外框實際曲線取得 Y 字連接點，避免接點突出拍框
            const targetJoinY = -bottomReach * 0.50;
            let leftJoin2 = null;
            let rightJoin2 = null;
            let bestLeftScore = Infinity;
            let bestRightScore = Infinity;

            for (const point of outer2DPoints) {
              if (point.y >= 0) continue;

              if (point.x < 0 && Math.abs(point.x) > halfWidth * 0.40) {
                const score = Math.abs(point.y - targetJoinY);
                if (score < bestLeftScore) {
                  bestLeftScore = score;
                  leftJoin2 = point.clone();
                }
              }

              if (point.x > 0 && Math.abs(point.x) > halfWidth * 0.40) {
                const score = Math.abs(point.y - targetJoinY);
                if (score < bestRightScore) {
                  bestRightScore = score;
                  rightJoin2 = point.clone();
                }
              }
            }

            if (!leftJoin2 || !rightJoin2) {
              leftJoin2 = new THREE.Vector2(-halfWidth * 0.58, -bottomReach * 0.48);
              rightJoin2 = new THREE.Vector2(halfWidth * 0.58, -bottomReach * 0.48);
            }

            window.paddleFrameBasis.leftJoin2 = leftJoin2;
            window.paddleFrameBasis.rightJoin2 = rightJoin2;

            // === 2) 外框：較亮的厚邊框 ===
            const FACE_THICKNESS = 0.022;
            const OUTLINE_RADIUS = 0.012;
            window.paddleFrameBasis.outlineRadius = OUTLINE_RADIUS;
            const tubeGeom = new THREE.TubeGeometry(
              curve,
              SEG,
              OUTLINE_RADIUS,
              10,
              true,
            );
            if (window.paddleOutlineMesh) {
              window.paddleOutlineMesh.geometry.dispose();
              window.paddleOutlineMesh.geometry = tubeGeom;
              window.paddleOutlineMesh.visible = true;
            }
            // 隱藏舊的 LineLoop
            if (window.paddleOutline) window.paddleOutline.visible = false;

            // === 3) 內層拍面：縮小一圈，留出像網球拍框的邊界 ===
            const INNER_WIDTH_SCALE = 0.93;
            const INNER_TOP_SCALE = 0.94;
            const INNER_BOTTOM_SCALE = 0.93;
            const innerShape = buildRacketShape(INNER_WIDTH_SCALE, INNER_TOP_SCALE, INNER_BOTTOM_SCALE);
            const faceGeom = new THREE.ShapeGeometry(innerShape, 56);
            const basis = new THREE.Matrix4().makeBasis(xAxis, yAxis, zAxis);
            basis.setPosition(C.clone().addScaledVector(zAxis, FACE_THICKNESS * 0.08));
            faceGeom.applyMatrix4(basis);

            window.paddleFaceMesh.geometry.dispose();
            window.paddleFaceMesh.geometry = faceGeom;
            window.paddleFaceMesh.material.transparent = true;
            window.paddleFaceMesh.material.opacity = 0.62;
            window.paddleFaceMesh.material.depthWrite = false;
            window.paddleFaceMesh.material.depthTest = false;
            window.paddleFaceMesh.material.side = THREE.DoubleSide;
            window.paddleFaceMesh.renderOrder = 3;
            window.paddleFaceMesh.visible = true;

            const innerHalfWidth = halfWidth * INNER_WIDTH_SCALE;
            const innerTopReach = topReach * INNER_TOP_SCALE;
            const innerBottomReach = bottomReach * INNER_BOTTOM_SCALE;
            const stringOffset = FACE_THICKNESS * 0.14;
            const stringPositions = [];
            const addStringSegment = (a2, b2) => {
              const a3 = from2(a2, stringOffset);
              const b3 = from2(b2, stringOffset);
              stringPositions.push(a3.x, a3.y, a3.z, b3.x, b3.y, b3.z);
            };

            const widthAtY = (y) => {
              if (y >= 0) {
                const ratio = THREE.MathUtils.clamp(y / innerTopReach, 0, 1);
                return innerHalfWidth * Math.pow(Math.max(0, 1 - ratio * ratio), 0.55);
              }
              const ratio = THREE.MathUtils.clamp(-y / innerBottomReach, 0, 1);
              return innerHalfWidth * Math.pow(Math.max(0, 1 - Math.pow(ratio, 1.45)), 0.58);
            };

            const topAtX = (x) => {
              const ratio = THREE.MathUtils.clamp(Math.abs(x) / innerHalfWidth, 0, 1);
              return innerTopReach * Math.pow(Math.max(0, 1 - ratio * ratio), 0.55);
            };

            const bottomAtX = (x) => {
              const ratio = THREE.MathUtils.clamp(Math.abs(x) / innerHalfWidth, 0, 1);
              return -innerBottomReach * Math.pow(Math.max(0, 1 - Math.pow(ratio, 1.45)), 0.72);
            };

            const verticalStringCount = 11;
            const horizontalStringCount = 12;
            for (let i = 0; i < verticalStringCount; i += 1) {
              const tVert = verticalStringCount === 1 ? 0.5 : i / (verticalStringCount - 1);
              const x = THREE.MathUtils.lerp(-innerHalfWidth * 0.88, innerHalfWidth * 0.88, tVert);
              addStringSegment(
                new THREE.Vector2(x, bottomAtX(x) * 0.94),
                new THREE.Vector2(x, topAtX(x) * 0.96),
              );
            }

            for (let i = 0; i < horizontalStringCount; i += 1) {
              const tHoriz = horizontalStringCount === 1 ? 0.5 : i / (horizontalStringCount - 1);
              const y = THREE.MathUtils.lerp(-innerBottomReach * 0.88, innerTopReach * 0.92, tHoriz);
              const w = widthAtY(y) * 0.97;
              addStringSegment(
                new THREE.Vector2(-w, y),
                new THREE.Vector2(w, y),
              );
            }

            const stringGeom = new THREE.BufferGeometry();
            stringGeom.setAttribute(
              "position",
              new THREE.Float32BufferAttribute(stringPositions, 3),
            );
            if (!window.paddleStringMesh) {
              window.paddleStringMesh = new THREE.LineSegments(
                stringGeom,
                new THREE.LineBasicMaterial({
                  color: 0xe6faff,
                  transparent: true,
                  opacity: 0.88,
                  depthTest: false,
                }),
              );
              window.paddleStringMesh.renderOrder = 4;
              scene.add(window.paddleStringMesh);
            } else {
              window.paddleStringMesh.geometry.dispose();
              window.paddleStringMesh.geometry = stringGeom;
              window.paddleStringMesh.visible = true;
            }
          } else {
            window.paddleFrameBasis = null;
            // Hide Face
            if (window.paddleFaceMesh) window.paddleFaceMesh.visible = false;
            if (window.paddleStringMesh) window.paddleStringMesh.visible = false;
            // Hide old LineLoop
            if (window.paddleOutline) window.paddleOutline.visible = false;
            // Hide new Tube
            if (window.paddleOutlineMesh)
              window.paddleOutlineMesh.visible = false;
          }
        } catch (err) {
          console.error("Error drawing paddle face:", err);
          if (window.paddleFaceMesh) window.paddleFaceMesh.visible = false;
          if (window.paddleStringMesh) window.paddleStringMesh.visible = false;
          if (window.paddleOutlineMesh)
            window.paddleOutlineMesh.visible = false;
          if (window.paddleOutline) window.paddleOutline.visible = false;
        }

        // === 握把繪製：用 grip_top ↔ grip_bottom 畫主幹，再用 bottom ↔ grip_top 畫連接段 ===
        try {
          const gripTopP = frame.paddle && frame.paddle.grip_top;
          const gripBottomP = frame.paddle && frame.paddle.grip_bottom;
          const bottomP = frame.paddle && frame.paddle.bottom;

          // 如果grip点为null，尝试用bottom点和wrist点估算握把位置
          const canDrawHandle =
            visibilityState["paddle_center"] && bottomP && validPoint(bottomP);

          if (canDrawHandle) {
            let gt, gb;

            if (validPoint(gripTopP) && validPoint(gripBottomP)) {
              // 有grip数据，直接使用
              gt = new THREE.Vector3(
                (gripTopP.x - globalCenter.x) * SCALE_FACTOR,
                (gripTopP.y - globalMinY) * SCALE_FACTOR,
                -(gripTopP.z - globalCenter.z) * SCALE_FACTOR,
              );
              gb = new THREE.Vector3(
                (gripBottomP.x - globalCenter.x) * SCALE_FACTOR,
                (gripBottomP.y - globalMinY) * SCALE_FACTOR,
                -(gripBottomP.z - globalCenter.z) * SCALE_FACTOR,
              );
            } else {
              // grip数据缺失，用bottom点和right_wrist估算
              const wristP = frame.right_wrist;
              const vecB = new THREE.Vector3(
                (bottomP.x - globalCenter.x) * SCALE_FACTOR,
                (bottomP.y - globalMinY) * SCALE_FACTOR,
                -(bottomP.z - globalCenter.z) * SCALE_FACTOR,
              );

              if (validPoint(wristP)) {
                const wrist = new THREE.Vector3(
                  (wristP.x - globalCenter.x) * SCALE_FACTOR,
                  (wristP.y - globalMinY) * SCALE_FACTOR,
                  -(wristP.z - globalCenter.z) * SCALE_FACTOR,
                );
                // 估算grip_top为bottom和wrist的中点偏向bottom 30%
                gt = new THREE.Vector3().lerpVectors(vecB, wrist, 0.3);
                // 估算grip_bottom为wrist点
                gb = wrist.clone();
              } else {
                // 连wrist都没有，只画从bottom延伸的短握把
                const handleLength = 0.15; // 握把长度
                gt = vecB.clone();
                gb = new THREE.Vector3(
                  vecB.x + handleLength * 0.5,
                  vecB.y + handleLength * 0.866, // 向下延伸
                  vecB.z,
                );
              }
            }

            // 防呆：如果 gt 和 gb 非常接近，避免 TubeGeometry 錯誤
            if (gt.distanceToSquared(gb) < 1e-9) {
              gb.y -= 0.01;
            }

            const HANDLE_RADIUS = 0.032; // 握把加粗 1 倍
            const handleDir = new THREE.Vector3().subVectors(gb, gt).normalize();

            // (1) 主幹：grip_top -> grip_bottom
            const handleMainCurve = new THREE.CatmullRomCurve3([gt, gb], false);
            const handleMainGeom = new THREE.TubeGeometry(
              handleMainCurve,
              1,
              HANDLE_RADIUS,
              12,
              false,
            );

            if (!window.paddleHandleMesh) {
              window.paddleHandleMesh = new THREE.Mesh(
                handleMainGeom,
                new THREE.MeshStandardMaterial({
                  color: 0x38bdf8,
                  roughness: 0.56,
                  metalness: 0.12,
                  emissive: new THREE.Color(0x0ea5e9).multiplyScalar(0.12),
                  emissiveIntensity: 0.5,
                }),
              );
              window.paddleHandleMesh.castShadow = true;
              window.paddleHandleMesh.receiveShadow = true;
              scene.add(window.paddleHandleMesh);
            } else {
              window.paddleHandleMesh.geometry.dispose();
              window.paddleHandleMesh.geometry = handleMainGeom;
              window.paddleHandleMesh.visible = true;
            }

            const neckMaterial = new THREE.MeshStandardMaterial({
              color: 0x22d3ee,
              roughness: 0.24,
              metalness: 0.28,
              emissive: new THREE.Color(0x06b6d4).multiplyScalar(0.16),
              emissiveIntensity: 0.65,
            });

            if (!window.paddleNeckMesh) {
              window.paddleNeckMesh = new THREE.Mesh(
                new THREE.BufferGeometry(),
                neckMaterial.clone(),
              );
              window.paddleNeckMesh.castShadow = true;
              window.paddleNeckMesh.receiveShadow = true;
              scene.add(window.paddleNeckMesh);
            }

            if (!window.paddleThroatLeftMesh) {
              window.paddleThroatLeftMesh = new THREE.Mesh(
                new THREE.BufferGeometry(),
                neckMaterial.clone(),
              );
              window.paddleThroatLeftMesh.castShadow = true;
              window.paddleThroatLeftMesh.receiveShadow = true;
              scene.add(window.paddleThroatLeftMesh);
            }

            if (!window.paddleThroatRightMesh) {
              window.paddleThroatRightMesh = new THREE.Mesh(
                new THREE.BufferGeometry(),
                neckMaterial.clone(),
              );
              window.paddleThroatRightMesh.castShadow = true;
              window.paddleThroatRightMesh.receiveShadow = true;
              scene.add(window.paddleThroatRightMesh);
            }

            const bottomVec = new THREE.Vector3(
              (bottomP.x - globalCenter.x) * SCALE_FACTOR,
              (bottomP.y - globalMinY) * SCALE_FACTOR,
              -(bottomP.z - globalCenter.z) * SCALE_FACTOR,
            );
            const canDrawThroat = Boolean(window.paddleFrameBasis);

            if (canDrawThroat) {
              const frameBasis = window.paddleFrameBasis;
              const throatLeft = new THREE.Vector3()
                .copy(frameBasis.center)
                .addScaledVector(frameBasis.xAxis, frameBasis.leftJoin2.x)
                .addScaledVector(frameBasis.yAxis, frameBasis.leftJoin2.y)
                .addScaledVector(frameBasis.zAxis, 0.002);
              const throatRight = new THREE.Vector3()
                .copy(frameBasis.center)
                .addScaledVector(frameBasis.xAxis, frameBasis.rightJoin2.x)
                .addScaledVector(frameBasis.yAxis, frameBasis.rightJoin2.y)
                .addScaledVector(frameBasis.zAxis, 0.002);

              if (window.paddleNeckMesh) {
                window.paddleNeckMesh.visible = false;
              }

              const leftMid = new THREE.Vector3()
                .lerpVectors(throatLeft, gt, 0.50)
                .addScaledVector(frameBasis.xAxis, -frameBasis.halfWidth * 0.05)
                .addScaledVector(frameBasis.yAxis, frameBasis.bottomReach * 0.02);

              const throatLeftCurve = new THREE.CatmullRomCurve3(
                [throatLeft, leftMid, gt],
                false,
              );
              const throatLeftGeom = new THREE.TubeGeometry(
                throatLeftCurve,
                18,
                frameBasis.outlineRadius || 0.012,
                10,
                false,
              );
              window.paddleThroatLeftMesh.geometry.dispose();
              window.paddleThroatLeftMesh.geometry = throatLeftGeom;
              window.paddleThroatLeftMesh.visible = true;

              const rightMid = new THREE.Vector3()
                .lerpVectors(throatRight, gt, 0.50)
                .addScaledVector(frameBasis.xAxis, frameBasis.halfWidth * 0.05)
                .addScaledVector(frameBasis.yAxis, frameBasis.bottomReach * 0.02);

              const throatRightCurve = new THREE.CatmullRomCurve3(
                [throatRight, rightMid, gt],
                false,
              );
              const throatRightGeom = new THREE.TubeGeometry(
                throatRightCurve,
                18,
                frameBasis.outlineRadius || 0.012,
                10,
                false,
              );
              window.paddleThroatRightMesh.geometry.dispose();
              window.paddleThroatRightMesh.geometry = throatRightGeom;
              window.paddleThroatRightMesh.visible = true;
            } else {
              const connectCurve = new THREE.CatmullRomCurve3([bottomVec, gt], false);
              const connectGeom = new THREE.TubeGeometry(
                connectCurve,
                10,
                HANDLE_RADIUS * 0.95,
                10,
                false,
              );
              window.paddleNeckMesh.geometry.dispose();
              window.paddleNeckMesh.geometry = connectGeom;
              window.paddleNeckMesh.visible = true;
              if (window.paddleThroatLeftMesh) window.paddleThroatLeftMesh.visible = false;
              if (window.paddleThroatRightMesh) window.paddleThroatRightMesh.visible = false;
            }

            const capRadius = HANDLE_RADIUS * 1.18;
            if (!window.paddleCapMesh) {
              window.paddleCapMesh = new THREE.Mesh(
                new THREE.CylinderGeometry(capRadius, capRadius * 0.92, HANDLE_RADIUS * 1.2, 12),
                new THREE.MeshStandardMaterial({
                  color: 0x0891b2,
                  roughness: 0.5,
                  metalness: 0.14,
                  emissive: new THREE.Color(0x06b6d4).multiplyScalar(0.08),
                  emissiveIntensity: 0.4,
                }),
              );
              window.paddleCapMesh.castShadow = true;
              window.paddleCapMesh.receiveShadow = true;
              scene.add(window.paddleCapMesh);
            }
            window.paddleCapMesh.visible = true;
            window.paddleCapMesh.position.copy(gb);
            window.paddleCapMesh.scale.set(1.0, 1.0, 1.0);
            tempQuat.setFromUnitVectors(new THREE.Vector3(0, 1, 0), handleDir);
            window.paddleCapMesh.quaternion.copy(tempQuat);
          } else {
            if (window.paddleHandleMesh)
              window.paddleHandleMesh.visible = false;
            if (window.paddleNeckMesh) window.paddleNeckMesh.visible = false;
            if (window.paddleThroatLeftMesh) window.paddleThroatLeftMesh.visible = false;
            if (window.paddleThroatRightMesh) window.paddleThroatRightMesh.visible = false;
            if (window.paddleCapMesh) window.paddleCapMesh.visible = false;
          }
        } catch (err) {
          console.error("Error drawing paddle handle:", err);
          if (window.paddleHandleMesh) window.paddleHandleMesh.visible = false;
          if (window.paddleNeckMesh) window.paddleNeckMesh.visible = false;
          if (window.paddleThroatLeftMesh) window.paddleThroatLeftMesh.visible = false;
          if (window.paddleThroatRightMesh) window.paddleThroatRightMesh.visible = false;
          if (window.paddleCapMesh) window.paddleCapMesh.visible = false;
        }
      }

      function updateFrame() {
        document.getElementById("slider").value = currentFrame;

        let frameInfoText = `frame: ${currentFrame}`;
        if (window.hitFrames && window.hitFrames.includes(currentFrame)) {
          frameInfoText += " [HIT]";

        } else {

        }

        updatePose(currentFrame);
        if (showingFullTrajectory) {

        }
        const fb = document.getElementById("feedbackContent");
        if (fb && fb.textContent.includes("Frame")) {
          const rg = fb.textContent.match(/Frame (\d+)-(\d+)/);
          if (rg) {
            const [st, ed] = [parseInt(rg[1]), parseInt(rg[2])];
            fb.style.background =

                ? "rgba(255,0,0,0.3)"
                : "rgba(42,42,42,0.7)";

      // 更新多檔案軌跡
      function updateMultiTrajectories() {
        multiFileTrajectories.lines.forEach((l) => scene.remove(l));
        multiFileTrajectories.lines.clear();
        multiFileTrajectories.labels.forEach((lb) => {
          scene.remove(lb);
          lb.element && lb.element.remove();
        });
        multiFileTrajectories.labels.clear();
        if (!multiFileTrajectories.visible) return;
        const fi = document.getElementById("dirInput");
        if (!fi) return;
        const all = Array.from(fi.files)
          .filter((f) => f.name.includes("(3D_trajectory_smoothed).json"))
          .filter(
            (f) =>
              !multiFileTrajectories.selectedFiles ||
              multiFileTrajectories.selectedFiles.includes(f.webkitRelativePath),
          );
        all.forEach(async (file, idx) => {
          try {
            const txt = await file.text();
            const data = JSON.parse(
              txt
                .replace(/^\uFEFF/, "")
                .replace(/:\s*NaN/g, ": null")
                .trim(),
            );
            const arr = (Array.isArray(data) ? data : [data])
              .map((fr) => {
                const p = fr.right_wrist;
                if (!validPoint(p)) return null;
                return new THREE.Vector3(
                  (p.x - globalCenter.x) * SCALE_FACTOR,
                  (p.y - globalMinY) * SCALE_FACTOR,
                  -(p.z - globalCenter.z) * SCALE_FACTOR,
                );
              })
              .filter(Boolean);
            if (!arr.length) return;
            const positions = [];
            arr.forEach((v) => positions.push(v.x, v.y, v.z));
            const geo = new LineGeometry();
            geo.setPositions(positions);
            const mat = new LineMaterial({
              color: generateColor(idx),
              linewidth: 5,
              transparent: true,
              opacity: 1.0,
              resolution: new THREE.Vector2(
                window.innerWidth,
                window.innerHeight,
              ),
            });
            const line = new Line2(geo, mat);
            line.computeLineDistances();
            scene.add(line);
            multiFileTrajectories.lines.set(file.name, line);
            const lastPoint = arr[arr.length - 1];
            const div = document.createElement("div");
            div.className = "trajectory-label";
            const num = file.name.match(/\d+/);
            div.textContent = num ? num[0] : "";
            div.style.color = generateColor(idx);
            const lb = new CSS2DObject(div);
            lb.position.copy(lastPoint);
            scene.add(lb);
            multiFileTrajectories.labels.set(file.name, lb);
          } catch (e) {
            console.error(e);
          }
        });
      }

      // 隨機顏色產生器
      function generateColor(i) {
        const c = [
          "#39FF14",
          "#FF1493",
          "#00FFFF",
          "#FFD700",
          "#FF4500",
          "#FF00FF",
          "#00FF00",
          "#FF69B4",
          "#1E90FF",
          "#32CD32",
          "#FF6347",
          "#7B68EE",
        ];
        return c[i % c.length];
      }

            if (!originalFeedbackContent || !originalOverallContent) {
              // 第一次點擊時儲存兩個元素的原始內容
              originalFeedbackContent = feedbackContent.textContent.trim();
              originalOverallContent = overallContent.textContent.trim();
            }

            if (isTranslated) {

              feedbackContent.textContent = originalFeedbackContent;
              overallContent.textContent = originalOverallContent;
              toggleButton.textContent = "Eng";
              isTranslated = false;
            } else {
              // 目前是中文，切換成英文
              // 顯示 Loading 狀態
              feedbackContent.textContent = "翻譯中...";
              overallContent.textContent = "翻譯中...";

              try {
                const [feedbackResponse, overallResponse] = await Promise.all([
                  fetch(
                    `${BASE_API}/translate?text=${encodeURIComponent(originalFeedbackContent)}`,
                    {
                      method: "GET",
                      headers: { Accept: "application/json" },
                      mode: "cors",
                    },
                  ),
                  fetch(
                    `${BASE_API}/translate?text=${encodeURIComponent(originalOverallContent)}`,
                    {
                      method: "GET",
                      headers: { Accept: "application/json" },
                      mode: "cors",
                    },
                  ),
                ]);

                const feedbackData = await feedbackResponse
                  .json()
                  .catch(() => ({}));
                const overallData = await overallResponse
                  .json()
                  .catch(() => ({}));

                const getBackendError = (res, data) => {
                  if (res.ok) return null;
                  const d = data?.detail;
                  if (typeof d === "string") return d;
                  if (d && typeof d.error === "string") return d.error;
                  return res.statusText || "翻譯失敗";
                };

                const err1 = getBackendError(feedbackResponse, feedbackData);
                const err2 = getBackendError(overallResponse, overallData);
                if (err1 || err2) {
                  showMsg("翻譯請求錯誤: " + (err1 || err2), "error");
                  // 發生錯誤時恢復原文
                  feedbackContent.textContent = originalFeedbackContent;
                  overallContent.textContent = originalOverallContent;
                  return;
                }

                const fbText = feedbackData.translated_text;
                const ovText = overallData.translated_text;
                if (
                  feedbackData.status === "success" &&
                  overallData.status === "success" &&
                  (fbText !== undefined || ovText !== undefined)
                ) {
                  if (fbText !== undefined)
                    feedbackContent.textContent = String(fbText);
                  if (ovText !== undefined)
                    overallContent.textContent = String(ovText);
                  toggleButton.textContent = "繁中";
                  isTranslated = true;
                } else {
                  showMsg("翻譯請求錯誤: 未取得翻譯結果", "error");
                  // 發生錯誤時恢復原文
                  feedbackContent.textContent = originalFeedbackContent;
                  overallContent.textContent = originalOverallContent;
                }
              } catch (err) {
                const hint =
                  err.message === "Failed to fetch"
                    ? "請確認已啟動 main.py（port 8000）"
                    : err.message;
                showMsg("翻譯請求錯誤: " + hint, "error");
                // 發生錯誤時恢復原文
                feedbackContent.textContent = originalFeedbackContent;
                overallContent.textContent = originalOverallContent;
              }
            }
          });
        document
          .getElementById("showFullTrajectoryButton")
          .addEventListener("click", () => {
            showingFullTrajectory = !showingFullTrajectory;
            const btn = document.getElementById("showFullTrajectoryButton");
            btn.textContent = showingFullTrajectory
              ? "hide trajectory"
              : "Show full trajectory";

              : "#4CAF50";

        document
          .getElementById("speedControl")
          .addEventListener("input", (e) => {
            playbackSpeed = parseFloat(e.target.value);
            document.getElementById("speedValue").textContent =
              playbackSpeed.toFixed(1) + "x";
            if (isPlaying) {
              clearInterval(frameInterval);
              frameInterval = setInterval(
                () => {
                  currentFrame = (currentFrame + 1) % trajectoryData.length;
                  updateFrame();
                },
                1000 / (30 * playbackSpeed),
              );
            }
          });
        window.addEventListener("resize", () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
          labelRenderer.setSize(window.innerWidth, window.innerHeight);
          lines.forEach((l) => {
            if (l.material && l.material.resolution) {
              l.material.resolution.set(window.innerWidth, window.innerHeight);
            }
          });
          Object.values(trajectorySystem).forEach((t) => {
            if (t.line && t.line.material && t.line.material.resolution) {
              t.line.material.resolution.set(
                window.innerWidth,

              );
            }
          });
          multiFileTrajectories.lines.forEach((l) => {
            if (l.material && l.material.resolution) {
              l.material.resolution.set(window.innerWidth, window.innerHeight);
            }
          });
        });
      }

      // API 呼叫事件設定 (所有 api-form 表單共用)
      function setupApiHandlers() {
        const base = BASE_API;
        document.querySelectorAll(".api-form").forEach((f) => {
          f.addEventListener("submit", async (e) => {
            e.preventDefault();
            // 清除該表單內的先前提示資訊
            const form = e.target.closest("form");
            form.querySelectorAll(".api-info").forEach((el) => el.remove());

            const ep = f.dataset.endpoint;
            const formData = new FormData(f);
            const params = new URLSearchParams();
            for (const [k, v] of formData.entries()) {
              params.append(k, v);
            }
            const url = `${base}${ep}?${params}`;

            try {
              const r = await fetch(url, {
                method: "GET",
                headers: {
                  Accept: "application/json",
                  "Content-Type": "application/json",
                },
                mode: "cors",
              });
              const d = await r.json();
              if (r.status === 200) {
                showMsg("Success!", "success");
              } else {
                throw new Error(d.detail || "Request failed");
              }
              // 新增提示文字
              const info = document.createElement("div");
              info.className = "api-info";
              info.style.color = "white";
              info.style.fontSize = "10px";
              info.textContent = `Input: ${JSON.stringify(Object.fromEntries(formData))} | Code: ${r.status} | Time: ${new Date().toLocaleTimeString()}`;
              form.appendChild(info);
            } catch (err) {
              showMsg(err.message, "error");
            }
          });
        });
      }

      async function checkFirstBallReady() {
        try {
          const response = await fetch("/getFolders");
          if (!response.ok) return;
          const folderInfos = await response.json();
          if (folderInfos.length === 0) return;

          // 按修改时间排序，取得最新的一個
          folderInfos.sort((a, b) => b.mtime - a.mtime);
          const latestFolderInfo = folderInfos[0];
          const latestFolderFull = latestFolderInfo.name;
          const cleanName = latestFolderFull
            .split("_trajectory")[0]
            .replace(/_+$/, ""); // 移除末尾的下划线

          // 如果換了新資料夾（新客戶），重設通知狀態
          if (latestFolderFull !== lastCheckedFolder) {
            lastCheckedFolder = latestFolderFull;
            notifiedBalls.clear(); // 清空已通知記錄，這樣新客戶的球會重新通知
          }

          // 檢查所有 trajectory_N 資料夾
          for (let ballNum = 1; ballNum <= 50; ballNum++) {
            const ballKey = `${latestFolderFull}-ball${ballNum}`;

            // 如果已經通知過，跳過
            if (notifiedBalls.has(ballKey)) continue;

            try {
              const videoResponse = await fetch(
                `/getVideos?folder=${latestFolderFull}/trajectory_${ballNum}`,
              );
              if (videoResponse.ok) {
                const files = await videoResponse.json();
                if (files.includes("ready.txt")) {
                  notifyBallReady(cleanName, ballNum);
                  notifiedBalls.add(ballKey); // 標記為已通知
                }
              }
            } catch (e) {
              // 如果找不到該球的資料夾，繼續檢查下一個
            }
          }
        } catch (error) {
          console.error("[通知系統] 輪詢異常:", error);
        }
      }

      function notifyBallReady(playerName, ballNumber) {
        const notification = document.createElement("div");
        notification.id = "readyNotification";
        notification.style.cssText = `
                position: fixed;
                top: 25px;
                right: 25px;
                background: rgba(30, 30, 30, 0.95);
                color: white;
                padding: 24px;
                border-radius: 12px;
                border-left: 6px solid #4CAF50;
                box-shadow: 0 10px 30px rgba(0,0,0,0.5);
                z-index: 99999;
                min-width: 300px;
                font-family: Arial, sans-serif;
                animation: slideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            `;
        notification.innerHTML = `
                <div style="margin-bottom: 8px; font-size: 20px; color: #4CAF50;"><strong>🔔 Analysis Complete!</strong></div>
                <div style="margin-bottom: 18px; color: #eee; font-size: 16px;">Player <strong>${playerName}</strong> - Ball <strong>${ballNumber}</strong> result is ready.</div>
                <div style="display: flex; gap: 10px;">
                    <button id="viewResultBtn" style="background: #4CAF50; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 16px; flex: 2; font-weight: bold;">View Result</button>
                    <button id="closeNotifyBtn" style="background: transparent; color: #999; border: 1px solid #444; padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; flex: 1;">Dismiss</button>
                </div>
            `;
        document.body.appendChild(notification);

        // 語音通知 - 修複語音問題
        window.speechSynthesis.cancel(); // 停止任何正在進行的語音
        const msg = new SpeechSynthesisUtterance(
          `Ball ${ballNumber} result for ${playerName} is ready. Please check the display.`,
        );
        msg.lang = "en-US";
        msg.rate = 0.9; // 調整說話速度
        msg.pitch = 1.0;
        msg.volume = 1.0; // 確保音量最大
        window.speechSynthesis.speak(msg);

        // 點擊「立即查看」
        document.getElementById("viewResultBtn").onclick = () => {
          // 在 3D 頁面中，點擊後開啟資料夾選擇器 (dirInput)
          const dirInput = document.getElementById("dirInput");
          if (dirInput) {
            dirInput.click();
          } else {
            console.warn("[通知系統] 找不到 dirInput，請手動選擇資料夾");
          }
          notification.remove();
        };

        document.getElementById("closeNotifyBtn").onclick = () =>
          notification.remove();

        // 20秒後自動消失
        setTimeout(() => {
          if (document.getElementById("readyNotification")) {
            notification.style.opacity = "0";
            notification.style.transition = "opacity 1s ease";
            setTimeout(() => notification.remove(), 1000);
          }
        }, 20000);
      }

      // 加入動畫樣式到 head
      const style3D = document.createElement("style");
      style3D.innerHTML = `
            @keyframes slideIn {
                from { transform: translateX(120%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
        `;
      document.head.appendChild(style3D);
    </script>
  </body>
</html>
